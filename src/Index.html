<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap');
:root{
  --bg:#F3F5F9;--card:#FFFFFF;--ink:#0F1B2D;--muted:#5F6B7E;--line:#E2E7EF;
  --pri:#0A5C7A;--pri-ink:#FFFFFF;--pri-soft:#E3F1F6;--navy:#0B2545;--gold:#F39C12;
  --sh:0 1px 2px rgba(15,27,45,.05),0 2px 8px rgba(15,27,45,.04);
  --doc:#2B63B5;--doc-soft:#E2ECFA;--che:#8A4FB8;--che-soft:#F1E6FA;--sto:#B5650B;--sto-soft:#FCEEDC;
  --red:#C3392B;--red-soft:#FBE3E0;--amb:#B97A06;--amb-soft:#FCF1D6;--wa:#1DA851;
  --r:14px;--f:"Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:0 14px 96px}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:var(--pri-ink);margin:0 -14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:0;background:rgba(255,255,255,.18);color:inherit;width:40px;height:40px;border-radius:10px;font-size:1.3rem;cursor:pointer;flex:none}
.top small{opacity:.85;font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hello h2{margin:0;font-size:1.35rem}
.hello p{margin:0;color:var(--muted);font-size:.9rem}
.area{background:var(--card);border:2px solid var(--pri);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;text-align:left}
.area .ic{font-size:1.8rem}
.area b{display:block;font-size:1.1rem}
.area span{color:var(--muted);font-size:.82rem}
.area .chg{margin-left:auto;background:var(--pri-soft);color:var(--pri);font-weight:700;border-radius:8px;padding:6px 10px;font-size:.85rem;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;position:relative;min-height:122px;justify-content:center;text-decoration:none}
.tile:active{transform:scale(.97)}
.tile .em{font-size:2.4rem;line-height:1}
.tile b{font-size:1.05rem}
.tile small{color:var(--muted);font-size:.76rem;margin-top:-4px}
.tile .badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border-radius:99px;font-size:.8rem;font-weight:700;padding:1px 8px}
.tile.big{grid-column:span 2;flex-direction:row;min-height:84px;gap:14px;background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.tile.big small{color:inherit;opacity:.85}
.tile.big div{text-align:left;display:flex;flex-direction:column}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.red{color:var(--red)}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto;white-space:nowrap}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.party{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.party .main{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center}
.pic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;flex:none}
.pic.Doctor{background:var(--doc-soft)}.pic.Chemist{background:var(--che-soft)}.pic.Stockist{background:var(--sto-soft)}
.party .info{flex:1;min-width:0}
.party .name{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.party .sub{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.pill{font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;display:inline-block}
.pill.due{background:var(--amb-soft);color:var(--amb)}
.pill.done{background:var(--pri-soft);color:var(--pri)}
.pill.late{background:var(--red-soft);color:var(--red)}
.pill.cat{background:#0000000d;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.acts a,.acts button{border:0;background:none;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:none}
.acts a+a,.acts a+button,.acts button+a,.acts button+button{border-left:1px solid var(--line)}
.acts .em{font-size:1.35rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 10px;font-size:1rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:700;font-size:.92rem}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:1rem;min-width:0}
textarea.in{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:700}
.type .em{font-size:2rem}
.type[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood button{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:700;font-size:.9rem}
.mood .em{font-size:2rem}
.mood button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qty:first-child{border-top:0}
.qty .n{display:flex;align-items:center;gap:8px}
.qty button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.4rem;font-weight:700;cursor:pointer}
.qty output{min-width:34px;text-align:center;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:10px}
.h{border-left:3px solid var(--line);padding-left:10px}
.h.visit{border-color:var(--pri)}
.h .when{font-size:.8rem;color:var(--muted)}
.h p{margin:2px 0 0;overflow-wrap:anywhere;font-size:.92rem}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .em{font-size:2.6rem;display:block}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 14px 24px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
.sheet h3{margin:0;font-size:1.15rem}
.big-choice{display:grid;grid-template-columns:1fr;gap:8px}
.big-choice button,.big-choice a{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;font-size:1.05rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;text-decoration:none}
.big-choice .em{font-size:1.6rem}
.busy{position:fixed;inset:0;background:rgba(243,246,244,.7);z-index:90;display:grid;place-items:center}
.spin{width:44px;height:44px;border:4px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:95;font-weight:600;max-width:calc(100% - 28px);text-align:center}
.ok-big{text-align:center;padding:20px 0 6px}
.ok-big .em{font-size:4rem}
.ok-big h2{margin:6px 0 0}
.report{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:.92rem;overflow-wrap:anywhere}
.mgr-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mgr-tabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-weight:700;font-size:.84rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mgr-tabs .em{font-size:1.25rem}
.mgr-tabs button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.mr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mr-h{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.mr-h b{font-size:1.05rem}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.nums div{background:var(--bg);border-radius:10px;padding:6px}
.nums b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.nums span{font-size:.74rem;color:var(--muted)}
.vlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vlist .v{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:.9rem}
.vlist .v:last-child{border-bottom:0}
.vlist .t{font-variant-numeric:tabular-nums;color:var(--muted);width:44px;flex:none}
.vlist .g{flex:1;min-width:0;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.78rem;color:var(--muted)}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.linkbox{font-size:.78rem;background:var(--bg);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
.muted{color:var(--muted)}
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:20px}
.gate .em{font-size:4rem}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;box-shadow:0 -4px 16px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in-nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
.bnav button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:.72rem;color:var(--muted);cursor:pointer;position:relative}
.bnav .em{font-size:1.55rem;line-height:1.2;filter:grayscale(.6);opacity:.75}
.bnav button[aria-current="page"]{color:var(--pri)}
.bnav button[aria-current="page"] .em{filter:none;opacity:1}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
.bnav .dot{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:99px;font-size:.66rem;padding:0 5px}
.callrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px}
.callrow .info{flex:1;min-width:0}
.callrow .name{font-weight:700;overflow-wrap:anywhere}
.callrow .sub{color:var(--muted);font-size:.82rem}
.cbtn{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;text-decoration:none;border:0;cursor:pointer;flex:none}
.cbtn.call{background:var(--pri);color:#fff}
.cbtn.wa{background:#E3F6EA}
.cbtn[disabled]{opacity:.3}
.hint{background:var(--pri-soft);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--amb);border-radius:99px}
.bar i.ok{background:var(--pri)}
.att{display:flex;gap:12px;align-items:center}
.att .em{font-size:1.7rem}
.slot{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px}
.slot.done{border-left-color:var(--pri)}.slot.notmet{border-left-color:var(--red)}.slot.late{border-left-color:var(--amb)}
.slot .tm{font-weight:800;font-variant-numeric:tabular-nums;width:54px;flex:none;font-size:1.08rem}
.slot .g{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.met2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met2 button{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:700}
.met2 .em{font-size:1.9rem}
.met2 button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.met2 button.no[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.rc{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.rc .r2{display:grid;grid-template-columns:1fr 76px 44px;gap:6px}
.trow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.trow .d{width:78px;flex:none;font-size:.88rem;font-variant-numeric:tabular-nums}
.trow.sun .d{color:var(--red)}
.trow .in{padding:8px 10px}
.bday{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bday:first-of-type{border-top:0}
/* ===== professional theme ===== */
body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.top{background:linear-gradient(135deg,var(--navy) 0%,var(--pri) 100%);padding:12px 14px 14px;box-shadow:0 2px 10px rgba(11,37,69,.18)}
.top h1{font-weight:700;font-size:1.06rem;letter-spacing:-.01em}
.top small{font-weight:500;opacity:.78;font-size:.76rem}
.top .back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:10px;font-size:1.15rem}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.logo img{width:40px;height:40px;display:block}
.brandlogo{width:150px;height:150px;display:block;margin:0 auto}
.foot img{width:84px;height:84px;display:block;margin:0 auto 6px;border-radius:18px;background:#fff;box-shadow:var(--sh)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.hero .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--navy));color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.hero h2{margin:0;font-size:1.12rem;font-weight:700;line-height:1.25}
.hero p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.hero small{color:var(--muted);font-size:.8rem}
.hero .role{margin-left:auto;align-self:flex-start;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:.72rem;border-radius:99px;padding:3px 10px;letter-spacing:.03em}
.card,.party,.mr,.stat,.callrow,.slot,.tile,.area,.report{box-shadow:var(--sh);border-color:var(--line)}
.card h3{font-weight:700;font-size:.98rem;color:var(--navy)}
.lbl{color:var(--navy)}
.stat{padding:12px 8px}
.stat b{color:var(--navy);font-weight:800;font-size:1.45rem}
.stat span{font-weight:500}
.area{border:1px solid var(--line);border-left:4px solid var(--pri);padding:12px 14px}
.area .ic{width:42px;height:42px;border-radius:12px;background:var(--pri-soft);display:grid;place-items:center;font-size:1.3rem}
.area b{color:var(--navy)}
.tiles{gap:10px}
.tile{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:1px;align-items:center;justify-items:start;text-align:left;min-height:78px;padding:12px;border-radius:14px}
.tile .em{grid-row:1 / span 2;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:var(--pri-soft)}
.tile b{grid-column:2;font-size:.92rem;font-weight:700;color:var(--navy);line-height:1.25}
.tile small{grid-column:2;margin:0;font-size:.74rem}
.tile.big{grid-column:span 2;grid-template-rows:auto;min-height:72px;background:linear-gradient(135deg,var(--navy),var(--pri));border:0}
.tile.big .em{grid-row:auto;background:rgba(255,255,255,.14)}
.tile.big b{color:#fff}
.tile.big div{grid-column:2;width:100%}
.tile[style*="var(--card)"] b,.tile[style*="dashed"] b{color:var(--navy)}
.tile[style*="var(--card)"] .em,.tile[style*="dashed"] .em{background:var(--pri-soft)}
.tile[style*="background:var(--ink)"]{background:var(--navy)!important;border-color:var(--navy)!important}
.tile[style*="background:var(--ink)"] .em{background:rgba(255,255,255,.12)}
.tile[style*="background:var(--ink)"] b{color:#fff}
.tiles>.tile:not(.big):nth-of-type(6n+1) .em{background:#FFF4DE}
.tiles>.tile:not(.big):nth-of-type(6n+2) .em{background:#E4F4EA}
.tiles>.tile:not(.big):nth-of-type(6n+3) .em{background:#EDE9FB}
.tiles>.tile:not(.big):nth-of-type(6n+4) .em{background:#E3EEFB}
.tiles>.tile:not(.big):nth-of-type(6n+5) .em{background:#FCE8EC}
.tiles>.tile:not(.big):nth-of-type(6n) .em{background:#E3F1F6}
.tile .badge{top:8px;right:8px}
.tile b{padding-right:16px}
.tile.big[style*="var(--card)"]{background:var(--card)!important;border:1px solid var(--line)!important;border-left:4px solid var(--pri)!important}
.tile.big[style*="dashed"]{border:2px dashed var(--pri)!important}
.btn{border-radius:11px;font-weight:600;min-height:46px;box-shadow:0 1px 1px rgba(15,27,45,.04)}
.btn.pri{background:var(--pri);box-shadow:0 2px 6px rgba(10,92,122,.25)}
.btn.wa{box-shadow:0 2px 6px rgba(29,168,81,.25)}
.chip{border-width:1px;font-weight:500;font-size:.9rem;padding:7px 13px}
.chip[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:#fff}
.in,.search{border-color:#D5DCE6;border-radius:11px}
.in:focus,.search:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(10,92,122,.14)}
.pill{font-weight:600;border-radius:6px;padding:2px 8px}
.party .name{color:var(--navy)}
.acts{background:#FAFBFD}
.acts a,.acts button{color:#4A5568;font-weight:600}
.mgr-tabs button{font-weight:600;color:#3B4658;box-shadow:0 1px 1px rgba(15,27,45,.04)}
.mgr-tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.type[aria-pressed="true"],.mood button[aria-pressed="true"],.met2 button[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(10,92,122,.12)}
.hint{background:#EEF5FA;border:1px solid #D6E6F0;color:#22364F}
.bnav{border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(15,27,45,.06)}
.bnav button{font-weight:600}
.bnav button[aria-current="page"]{color:var(--pri)}
.bnav button[aria-current="page"]::before{background:var(--pri)}
.sheet .box{border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.sheet .box::before{content:"";width:40px;height:4px;border-radius:4px;background:#CBD3DE;align-self:center;margin:-6px 0 2px}
.big-choice button,.big-choice a{border-width:1px;font-weight:600;font-size:1rem;box-shadow:var(--sh)}
.bar{height:7px;background:#E8EDF3}
.bar i{background:var(--gold)}
.bar i.ok{background:#16A34A}
.toast{border-radius:12px;background:var(--navy);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.foot{text-align:center;color:var(--muted);font-size:.74rem;padding:8px 0 0}
</style>

function normH(h){ return String(h||'').toLowerCase().replace(/[^a-zऀ-ॿ]/g,''); }
function parseCSV(t){ var rows=[], row=[], f='', q=false; t=t.replace(/^﻿/,'');
  for(var i=0;i<t.length;i++){ var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','||c===';'||c==='\t'){ row.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); } return rows.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); }); }
function mapRows(grid){
  var hi=-1, map={};
  for(var r=0;r<Math.min(6,grid.length);r++){ var m={}; grid[r].forEach(function(h,j){ var n=normH(h); Object.keys(IMP_COLS).forEach(function(k){ if(m[k]===undefined && IMP_COLS[k].indexOf(n)>=0) m[k]=j; }); }); if(m.name!==undefined){ hi=r; map=m; break; } }
  if(hi<0) throw new Error('"Name" ya "नाम" wala column nahi mila. Pehli line mein column ke naam hone chahiye: Name, Phone, Area…');
  return grid.slice(hi+1).map(function(r){ var o={}; Object.keys(map).forEach(function(k){ o[k]=String(r[map[k]]==null?'':r[map[k]]).trim(); }); if(o.phone) o.phone=o.phone.replace(/\.0$/,''); return o; }).filter(function(o){ return o.name; });
}

  if(/\.(xlsx|xls)$/i.test(nm)){ var r=new FileReader(); r.onload=function(){ loadXLSX().then(function(X){ var wb=X.read(new Uint8Array(r.result),{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]]; done(X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''})); }).catch(fail); }; r.readAsArrayBuffer(file); return; }

var LANG = store('mrlang') || 'hg';

function hello(p, lg){
  var n=String(p.name||'').replace(/^dr\.?\s*/i,'');
  if(p.type==='Doctor') return {en:'Dear Dr. '+n+',', hi:'आदरणीय डॉ. '+n+' जी,', hg:'Aadarniya Dr. '+n+' ji,'}[lg];
  if(p.clinic) return {en:'Dear '+p.clinic+',', hi:'आदरणीय '+p.clinic+' जी,', hg:'Aadarniya '+p.clinic+' ji,'}[lg];
  return {en:'Dear Sir / Madam,', hi:'आदरणीय महोदय / महोदया,', hg:'Aadarniya Sir / Madam,'}[lg];
}
function sig(lg){ var co=(D&&D.company)||''; return {en:'Warm regards,', hi:'सादर,', hg:'Saadar,'}[lg]+'\n'+D.user.name+(co?'\n'+co:''); }
function whenTxt(date, time, lg){

}

      return sheet('<h3>🗑️ '+esc(mr0.name)+' को टीम से हटाएं?</h3><p class="muted" style="margin:0">Unka link turant band ho jayega. Purani visits, calls, samples ka record sheet mein safe rahega.</p><div class="field"><label for="rm_to">उनके डॉक्टर / केमिस्ट किसे दें?</label><select class="in" id="rm_to">'+others.map(function(x){ return '<option value="'+esc(x.id)+'">'+esc(x.name)+(x.role==='Manager'?' (Manager)':'')+'</option>'; }).join('')+'</select></div><button class="btn red" data-act="mremove-go" data-id="'+esc(id)+'">🗑️ हाँ, हटाएं</button><button class="btn" data-act="close-sheet">नहीं</button>'); }
    case 'mremove-go': return call('removeMR', id, $('#rm_to').value).then(function(r){ closeSheet(); toast('हटा दिया · '+r.moved+' doctor '+r.to+' ko diye'); return refresh().then(function(){ return loadMgr(); }); });
    case 'mbackup': return call('backupSheet').then(function(u){ M.backup=u; toast('💾 Backup copy ban gayi'); render(); });
    case 'mactive': return call('setMRActive', id, el.dataset.on==='true').then(function(){ toast('Ho gaya'); return loadMgr(); });
    case 'mreset': if(!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='Pakka? Purana link band hoga'; return; } return call('resetMRLink', id).then(function(){ toast('Naya link ban gaya'); return loadMgr(); });
    case 'maddprod': { var pn=$('#m_prod').value.trim(); if(!pn) return toast('Naam likhiye'); return call('saveProduct', pn, true).then(function(){ toast('✅ Product jud gaya'); return refresh().then(function(){ return loadMgr(); }); }); }
    case 'mprod': return call('saveProduct', el.dataset.p, el.dataset.on==='true').then(function(){ return refresh().then(function(){ return loadMgr(); }); });
    case 'mtarget': return call('setTargets', id, $('#tgd_'+id).value, $('#tgc_'+id).value).then(function(){ toast('🎯 टारगेट सेव'); return loadMgr(); });
    case 'mtour': return call('approveTour', id, M.data.month).then(function(){ toast('✅ टूर प्लान approve'); return loadMgr(); });
    case 'missue': { var q=+$('#si_q').value; if(!q) return toast('Kitne sample, ye likhiye'); var mid=$('#si_mr').value, pr=$('#si_p').value;
      return call('issueStock',{mrId:mid, product:pr, qty:q}).then(function(){ toast('✅ '+q+' '+pr+' दे दिए'); return refresh().then(function(){ return loadMgr(); }); }); }
    case 'pdel': { var pd=party(id); return sheet('<h3>🗑️ '+esc(drName(pd))+' को हटाएं?</h3><p class="muted" style="margin:0">List aur aage ke plan se hat jayega. Purani visits ka record Google Sheet mein rahega.</p><button class="btn red" data-act="pdel-go" data-id="'+esc(id)+'">🗑️ हाँ, हटाएं</button><button class="btn" data-act="close-sheet">नहीं</button>'); }
    case 'pdel-go': return call('deleteParty', id).then(function(){ closeSheet(); return refresh(); }).then(function(){ toast('हटा दिया'); back(); });
    case 'fdel': if(!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='पक्का?'; return; }
      return call('deleteFile', id).then(function(){ var c=cur(); c.files=null; toast('File हटा दी'); render(); });
    case 'lang': LANG=el.dataset.v; store('mrlang', LANG); if($('#layer .sheet') && waSheet.p) return waSheet(waSheet.p); return render();
    case 'copy': { var txt=el.dataset.text; if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast('📋 Copy ho gaya'); }, function(){ toast('Copy nahi hua — text ko daba ke rakhein aur copy karein'); }); } else toast('Copy nahi hua'); return; }
  }
});
document.addEventListener('input', function(e){ if(e.target.id==='areaQ'){ filterAreas(e.target.value); return; }
  if(e.target.id==='slotQ'){ var q=e.target.value.trim().toLowerCase(); document.querySelectorAll('#slotList [data-name]').forEach(function(b){ b.hidden=!!q && b.dataset.name.indexOf(q)<0; }); document.querySelectorAll('#slotList [data-grp]').forEach(function(g){ g.hidden=!g.querySelector('[data-name]:not([hidden])'); }); return; } if(e.target.id==='q'){ L.q=e.target.value; var pos=e.target.selectionStart; render(); var q=$('#q'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(x){} } });
function fileToB64(file){ return new Promise(function(res, rej){
  if(file.type==='application/pdf'){ if(file.size>10*1024*1024) return rej(new Error('PDF 10 MB se chhoti honi chahiye'));
    var r=new FileReader(); r.onload=function(){ res({data:String(r.result).split(',')[1], mime:'application/pdf', name:file.name}); }; r.onerror=function(){ rej(new Error('File padh nahi paaye')); }; r.readAsDataURL(file); return; }
  if(!/^image\//.test(file.type)) return rej(new Error('Sirf photo ya PDF'));
  var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){ var m=1600, w=img.width, h=img.height, k=Math.min(1, m/Math.max(w,h)); var cv=document.createElement('canvas'); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(u); res({data:cv.toDataURL('image/jpeg',0.82).split(',')[1], mime:'image/jpeg', name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg'}); };
  img.onerror=function(){ rej(new Error('Photo khul nahi payi')); }; img.src=u; }); }
document.addEventListener('change', function(e){
  if(e.target.id==='fileIn' && e.target.files[0]){ var pid=e.target.dataset.id; busy(true); fileToB64(e.target.files[0]).then(function(f){ f.partyId=pid; return run('uploadFile', f); }).then(function(){ busy(false); toast('📎 File save ho gayi'); var c=cur(); c.files=null; render(); }).catch(fail); return; }
  if(e.target.id==='libIn' && e.target.files[0]){ LIBUP.title=($('#lb_title').value||'').trim(); LIBUP.product=$('#lb_prod').value; busy(true);
    fileToB64(e.target.files[0]).then(function(f){ f.title=LIBUP.title||f.name.replace(/\.[^.]+$/,''); f.product=LIBUP.product; return run('uploadLibrary', f); }).then(function(l){ busy(false); D.library=l; LIBUP={title:'',product:''}; toast('📚 अपलोड हो गया · सब MR को दिखेगा'); render(); }).catch(fail); return; }
  if(e.target.id==='sm_mr'){ SM.mr=e.target.value; SM.data=null; render(); return; }
  if(e.target.id==='impIn' && e.target.files[0]){ readImport(e.target.files[0]); return; } if(e.target.id==='m_date'){ loadMgr(e.target.value); } if(e.target.id==='p_date' && e.target.value){ P.date=e.target.value<D.today?D.today:e.target.value; P.data=null; render(); } if(e.target.id==='v_nd'){ keepVisitInputs(); render(); } });

// ---------- boot ----------
function refresh(){ return run('boot').then(function(d){ D=d; }); }
function boot(again){
  if(!KEY){ gate('🔗','Apna link kholiye','Ye app sirf aapke personal link se khulta hai. Manager se apna link WhatsApp pe maangiye.'); return; }
  if(again) busy(true);
  run('boot').then(function(d){ D=d; busy(false); if(!again || !nav.length) nav=[{s:'home'}]; if(again && cur().s==='manager') M.data=null; render(); }, fail);
}
if(window.__DEMO_KEYS) window.__switchDemo=function(role){ KEY=window.__DEMO_KEYS[role]; nav=[]; M={tab:'team',date:'',data:null,open:{}}; L={q:'',type:'',mode:'area'}; V=null; A=null; D=null; $('#layer').innerHTML=''; boot(); };
boot();
})();
